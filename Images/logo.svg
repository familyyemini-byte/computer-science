<?xml version="1.0" encoding="utf-8"?>
<!-- Car-themed SVG logo with generic badge icons (no real company logos) -->
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="90" viewBox="0 0 420 90" preserveAspectRatio="xMidYMid meet">
  <rect width="420" height="90" rx="10" ry="10" fill="#1f2933" />

  <!-- Site name on the left -->
  <g transform="translate(18,20)">
    <text x="0" y="14" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="800">AutoHub</text>
    <text x="0" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#cbd5e1">Cars · Reviews · Gallery</text>
  </g>

  <!-- Row of generic badges on the right -->
  <g transform="translate(220,12)">
    <!-- badge 1: round wheel emblem -->
    <g transform="translate(0,0)">
      <circle cx="24" cy="24" r="24" fill="#111827" stroke="#374151" stroke-width="2" />
      <circle cx="24" cy="24" r="14" fill="#f97316" />
      <path d="M24 10 L24 38 M10 24 L38 24 M15 15 L33 33 M33 15 L15 33" stroke="#111827" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- badge 2: shield -->
    <g transform="translate(64,0)">
      <path d="M12 0 L36 0 L44 12 L36 40 L12 40 L4 12 Z" fill="#0ea5a4" stroke="#064e3b" stroke-width="1" />
      <rect x="10" y="8" width="28" height="6" rx="2" fill="#052f52" />
    </g>

    <!-- badge 3: lightning/bolt -->
    <g transform="translate(128,0)">
      <rect x="0" y="0" width="48" height="48" rx="8" fill="#111827"/>
      <polygon points="18,10 30,10 22,26 34,26 16,48 20,30 10,30" fill="#f59e0b" />
    </g>

    <!-- badge 4: steering wheel icon -->
    <g transform="translate(196,0)">
      <circle cx="24" cy="24" r="22" fill="#111827" stroke="#374151" stroke-width="2" />
      <circle cx="24" cy="24" r="8" fill="#e5e7eb" />
      <rect x="22" y="6" width="4" height="10" fill="#e5e7eb" transform="rotate(20 24 24)" />
    </g>
  </g>

</svg>
